<script>

    function selectItem(category, itemName, itemPrice) {
        // Ambil elemen modal berdasarkan ID-nya
        const modal = document.getElementById('orderModal');
        const catEl = document.getElementById('modalCategory');
        const nameEl = document.getElementById('modalItemName');
        const priceEl = document.getElementById('modalItemPrice');
        
        const inCat = document.getElementById('inputCategory');
        const inName = document.getElementById('inputItemName');
        const inPrice = document.getElementById('inputItemPrice');

        if (catEl) catEl.innerText = category;
        if (nameEl) nameEl.innerText = itemName;
        if (priceEl) priceEl.innerText = 'Rp ' + Number(itemPrice).toLocaleString('id-ID');
        
        if (inCat) inCat.value = category;
        if (inName) inName.value = itemName;
        if (inPrice) inPrice.value = itemPrice;
        
        // Memunculkan pop-up form dengan menghapus class 'hidden'
        if (modal) {
            modal.classList.remove('hidden');
        }
    }

    function closeOrderModal() {
        const modal = document.getElementById('orderModal');
        if (modal) {
            modal.classList.add('hidden');
        }
    }
