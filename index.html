<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASPAY - Point Blank Store & Jasa GB Terpercaya</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#09090b',
                        cardbg: '#121216',
                        gold: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gold-gradient {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border {
            border: 1px solid rgba(245, 158, 11, 0.3);
            transition: all 0.3s ease;
        }
        .gold-border:hover {
            border-color: rgba(245, 158, 11, 0.8);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.15);
        }
        .item-row {
            transition: all 0.2s ease;
        }
        .item-row:hover {
            background-color: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.5);
            transform: translateX(2px);
        }
        .custom-glow {
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.2);
        }
        @keyframes berdenyut {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
            50% { transform: scale(1.06); box-shadow: 0 0 20px rgba(245, 158, 11, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
        }
        .logo-animasi {
            animation: berdenyut 2.5s infinite ease-in-out;
        }
    </style>
</head>
